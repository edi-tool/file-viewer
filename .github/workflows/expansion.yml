name: Experimental format integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run vendor:ai
      - run: npx playwright install chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          node tests/expansion-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-ai-audit
          path: |
            experimental/illustrator/package-lock.json
            vendor/illustrator/SHA256.json
