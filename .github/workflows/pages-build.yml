name: Pages distribution
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy the verified artifact to GitHub Pages (only after license/release approval)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run vendor
      - run: bash scripts/build-jtd.sh
      - run: node scripts/preview-build.mjs --full
      - run: node scripts/verify-distribution.mjs
      - run: npx playwright install chromium
      - name: Test the exact distribution at Pages subpath
        run: |
          mkdir -p /tmp/viewer-site
          ln -s "$PWD/dist-preview" /tmp/viewer-site/file-viewer
          python3 -m http.server 8000 --bind 127.0.0.1 -d /tmp/viewer-site &
          VIEWER_BASE=http://127.0.0.1:8000/file-viewer/ node tests/expansion-browser.mjs
          VIEWER_BASE=http://127.0.0.1:8000/file-viewer/ node tests/jtd-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-distribution
          path: dist-preview/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: dist-preview
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
