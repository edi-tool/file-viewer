<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>統合ファイルビュワー | ファイル閲覧さん</title><link rel="stylesheet" href="styles.css"><script type="module" src="src/app.mjs"></script></head>
<body><header><a href="https://edi-tool.github.io/">edi-tool</a><span> / ファイル閲覧さん</span></header><main><h1>ファイル閲覧さん</h1><p>専用ソフトなしでファイルを確認。開発版です。再現性・印刷色を保証しません。</p><section class="panel drop" id="drop"><label for="pick">ファイルを選択（複数可）</label><input id="pick" type="file" multiple><p>またはここにドラッグ＆ドロップ</p><small>PDF・PDF互換AI・PSD・TIFF・EPS内TIFF・PNG・JPEG・GIF・WebP。依存ライブラリが必要な形式は準備済みの場合のみ表示できます。一太郎は本文表示の試験実装。</small></section>
<div class="workspace"><aside class="panel"><h2>ファイル一覧</h2><ul id="files"></ul><button id="clear" disabled>すべて閉じる</button></aside><section class="panel viewer"><div class="toolbar"><strong id="filename">ファイル未選択</strong><div><button id="prev" disabled>前へ</button><span id="page">—</span><button id="next" disabled>次へ</button><label for="zoom">倍率</label><select id="zoom" disabled><option value="1">100%</option><option value=".5">50%</option><option value="1.5">150%</option><option value="2">200%</option></select></div></div><p id="status" role="status" aria-live="polite">ファイルを選択してください。</p><p id="warning"></p><div id="preview" aria-label="プレビュー"></div></section></div><p>選択したファイルは端末内で処理されます。原本は変更しません。</p></main><footer><a href="https://edi-tool.github.io/">← edi-tool ツール一覧</a></footer></body></html>
